services:
  oratio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - API_ENV=${API_ENV:-development}
    volumes:
      - oratio-data:/app/backend/data
      - oratio-uploads:/app/backend/uploads
    restart: unless-stopped
    networks:
      - oratio-network

networks:
  oratio-network:
    driver: bridge

volumes:
  oratio-data:
  oratio-uploads:
