requires-python = ">=3.11"
dependencies = [
    "aiofiles>=23.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.95.0",
    "google-genai>=1.49.0",
    "httpx>=0.25.0",
    "orjson>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.5",
    "python-socketio>=5.9.0",
    "replit>=3.0.0",
    "uvicorn[standard]>=0.20.0",
    "websockets>=12.0",
]
